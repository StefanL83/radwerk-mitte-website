<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="radislav-title radislav-desc">
<title id="radislav-title">Radislav Radwerk – der fröhliche Fahrrad-Chatbot</title>
<desc id="radislav-desc">Charmante Comicfigur aus einem auf den Kopf gestellten Fahrrad: Zwei Fahrradreifen bilden die großen Augen, ein Fahrradrahmen das Gesicht und ein Sattel den geschwungenen Schnurrbart.</desc>
<defs>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42e0c3"/><stop offset="0.5" stop-color="#15bba8"/><stop offset="1" stop-color="#008f88"/></linearGradient>
 <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d5058"/><stop offset="0.5" stop-color="#172b34"/><stop offset="1" stop-color="#10242d"/></linearGradient>
 <linearGradient id="saddle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d4349"/><stop offset="0.5" stop-color="#28313a"/><stop offset="1" stop-color="#15252d"/></linearGradient>
 <linearGradient id="nose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdd7d"/><stop offset="1" stop-color="#ffae57"/></linearGradient>
 <filter id="shadow" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1b4750" flood-opacity=".22"/></filter>
</defs>
